[build-system]
requires      = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "sc-crop"
version     = "0.0.4"
description = "Spinal cord detection and volume cropping"
requires-python = ">=3.8"
dependencies = [
    "nibabel==5.3.3",
    "numpy>=1.24.0",
    "onnxruntime>=1.18.0",
    "pillow==11.3.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
yolo = ["ultralytics==8.4.33"]

[project.scripts]
sc_crop = "sc_crop.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
sc_crop = ["models/*.yaml"]
