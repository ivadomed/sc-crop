[build-system]
requires      = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "sc-crop"
version     = "0.10.0"
description = "Spinal cord detection and volume cropping"
readme      = "README.md"
license     = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "nibabel>=5.0.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.18.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "ultralytics>=8.0.0",
]

[project.urls]
Homepage   = "https://github.com/ivadomed/sc-crop"
Repository = "https://github.com/ivadomed/sc-crop"
Issues     = "https://github.com/ivadomed/sc-crop/issues"

[project.scripts]
sc_crop = "sc_crop.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
sc_crop = ["config.yaml"]
