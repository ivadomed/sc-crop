[build-system]
requires      = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "sc-crop"
version     = "0.6.0"
description = "Spinal cord detection and volume cropping"
requires-python = ">=3.8"
dependencies = [
    "nibabel>=5.0.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.18.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "ultralytics>=8.0.0",
]

[project.optional-dependencies]
segment = ["nnunet-onnx"]

[project.scripts]
sc_crop         = "sc_crop.cli:main"
sc-segment-onnx = "sc_crop.segment:_cli_segment_onnx"
sc-segment-pt   = "sc_crop.segment:_cli_segment_pt"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
sc_crop = ["config.yaml"]
