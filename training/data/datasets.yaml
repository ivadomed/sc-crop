# Dataset registry for spine detection project.
#
# Fields per dataset:
#   name         : directory name in data/raw/
#   host         : neuro | spine-generic | spineimage
#   url_https    : HTTPS URL for browsing in a web browser
#   url_ssh      : SSH clone URL (null = manual download)
#   mask_suffix  : SC mask filename suffix (required)
#   labels_dir   : subdirectory under derivatives/ containing labels (default: labels)
#   img_glob     : glob pattern to find the image from the subject/plane dir when the standard
#                  mask-stem derivation doesn't work (e.g. fMRI: "*_bold.nii.gz"). Default: null.
#   region       : cervical | lumbar | mixed | null (unknown)
#   multi_site   : true if the site is encoded in the subject name before the trailing digits
#                  (e.g. sub-mon001 → mon). Default: false (site = dataset name).
#   spinal_cord_label_index : value of the SC in multi-class masks (e.g. TotalSegmentator dseg).
#                  Default: 1 (binary SC mask).
#   anat_only    : true to only use labels inside an anat/ folder. Default: false.
#   exclude_suffixes : label suffixes to ignore although they end with mask_suffix
#                  (e.g. [_label-canal_seg.nii.gz] when mask_suffix is _seg.nii.gz). Default: [].
#   image_dirs   : extra folders (relative to the dataset) where images are looked for when they are
#                  not in the raw data (e.g. [derivatives/motion_correction] for moco images). Default: [].
#   external_test : true for datasets only used for external testing (all subjects in the external_test
#                  split). Only images with both an SC segmentation and a gold canal segmentation are used.
#                  Default: false.
#   canal_suffix : gold canal mask filename suffix, next to the SC mask (required if external_test).
#   canal_ignore_affine : true to accept gold canal masks whose affine differs from the image (same shape
#                  required). The canal is then considered to be on the image grid. Default: false.
#   sc_ignore_affine : same for the SC masks. Default: false.
#   pathology    : pathology of the subjects missing from participants.tsv (e.g. no pathology column).
#                  Default: unknown.
#   canal_label_index : for datasets without SC segmentation (e.g. CT, where the SC is not visible): value
#                  of the canal in the multi-class masks of mask_suffix. Their images are only used for the
#                  canal (no SC box). Default: null.
#
# spineimage datasets are cloned via SSH (Gitea) — requires SSH key access to spineimage.ca.
#
# Inspired from: https://github.com/ivadomed/model_cropping_sc_contrast-agnostic_yolo/blob/main/configs/datasets.yaml

datasets:

  # ── data.neuro.polymtl.ca ────────────────────────────────────────────────────
  - name: canproco
    host: neuro
    url_https: https://data.neuro.polymtl.ca/datasets/canproco
    url_ssh:   git@data.neuro.polymtl.ca:datasets/canproco
    mask_suffix: _label-SC_seg.nii.gz
    region:      cervical
    multi_site:  true
    exclude_suffixes: [_T2w_label-SC_seg.nii.gz]   # T2w scans are not used

  - name: dcm-brno
    host: neuro
    url_https: https://data.neuro.polymtl.ca/datasets/dcm-brno
    url_ssh:   git@data.neuro.polymtl.ca:datasets/dcm-brno
    mask_suffix: _seg.nii.gz
    region:      cervical
    anat_only:   true
    exclude_suffixes: [_label-canal_seg.nii.gz]

  - name: dcm-oklahoma
