    url_https: https://data.neuro.polymtl.ca/datasets/basel-mp2rage
    url_ssh:   git@data.neuro.polymtl.ca:datasets/basel-mp2rage
    mask_suffix: _label-SC_seg.nii.gz
    region:      cervical

