# Dataset registry for spine detection project.
#
# Fields per dataset:
#   name         : directory name in data/raw/
#   host         : neuro | spine-generic | spineimage
#   url_https    : HTTPS URL for browsing in a web browser
#   url_ssh      : SSH clone URL (null = manual download)
#   mask_suffix  : SC mask filename suffix (required)
#   labels_dir   : subdirectory under derivatives/ containing labels (default: labels)
#   img_glob     : glob pattern to find the image from the subject/plane dir when the standard
#                  mask-stem derivation doesn't work (e.g. fMRI: "*_bold.nii.gz"). Default: null.
#   region       : cervical | lumbar | mixed | null (unknown)
#   (out-of-domain test-only datasets are specified in configs/training_dataset.yaml → test_datasets)
#
# spineimage datasets are cloned via SSH (Gitea) — requires SSH key access to spineimage.ca.
#
# Inspired from: https://github.com/ivadomed/model_cropping_sc_contrast-agnostic_yolo/blob/main/configs/datasets.yaml

datasets:

